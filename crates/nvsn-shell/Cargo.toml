[package]
name = "nvsn-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

# Local-only performance benchmark (`cargo bench -p nvsn-shell`). `test = false`
# keeps `cargo test --all-targets` (what CI runs) from also invoking this
# binary; see crates/nvsn-core/.benches/hot_paths.rs for the full rationale and
# the "Benchmarks" section in the top-level README for the local-only policy.
# The source lives in `.benches/` (not Cargo's default `benches/`) so it does
# not show up as a top-level directory in the crate.
[[bench]]
name = "hot_paths"
path = ".benches/hot_paths.rs"
harness = false
test = false

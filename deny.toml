# cargo-deny policy: dependency advisories, license allowlist and source checks.
# Runs in CI with: cargo deny check

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses accepted. Anything else needs a recorded decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # MPL-2.0: file-level copyleft, pulled in by option-ext (dirs). Used unmodified, accepted.
    "MPL-2.0",
    # CDLA-Permissive-2.0: root certificate data (webpki-roots). Permissive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between nvsn crates are internal, not wildcards.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
